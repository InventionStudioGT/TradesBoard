<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shift Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
<style>
/* Layout: dark studio header band with one hazard-stripe rule, then a single working column. Each trade card carries its own discussion. */
:root{
  --yellow:#E9BF46; --charcoal:#343434; --steel:#6F6F6F;
  --bg:#F1F1EF; --surface:#FFFFFF; --sunk:#E7E7E4; --ink:#242424; --muted:#5F5F5F; --line:#D9D8D3;
  --yellow-soft:#FAEFCC; --yellow-ink:#7A5B00; --on-yellow:#262626;
  --head:#343434; --head-ink:#F4F4F2; --head-muted:#B9B9B6;
  --ok:#1F5FBF; --ok-soft:#DDE8F8; --warn:#B3261E; --warn-soft:#F9DEDC; --focus:#1F5FBF;
  --full:#2E7D46; --prov:#C8650F; --full-soft:#DCEFE2; --prov-soft:#FBE7D3;
  --f-display:"Century Gothic","CenturyGothic","AppleGothic","Questrial",Arial,sans-serif;
  --f-body:Arial,Helvetica,sans-serif;
  --f-mono:Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1C1C; --surface:#282828; --sunk:#222222; --ink:#ECECEA; --muted:#A6A6A2; --line:#3C3C3C;
  --yellow-soft:#3A321D; --yellow-ink:#F0CF6E; --on-yellow:#262626;
  --head:#343434; --head-ink:#F4F4F2; --head-muted:#B0B0AC;
  --ok:#8AB4FF; --ok-soft:#1C2A40; --warn:#F2B8B5; --warn-soft:#3B1D1B; --focus:#8AB4FF; --full:#3E9A5B; --prov:#D9741C; --full-soft:#1E3326; --prov-soft:#3D2A17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1C1C1C; --surface:#282828; --sunk:#222222; --ink:#ECECEA; --muted:#A6A6A2; --line:#3C3C3C;
  --yellow-soft:#3A321D; --yellow-ink:#F0CF6E; --on-yellow:#262626;
  --head:#343434; --head-ink:#F4F4F2; --head-muted:#B0B0AC;
  --ok:#8AB4FF; --ok-soft:#1C2A40; --warn:#F2B8B5; --warn-soft:#3B1D1B; --focus:#8AB4FF; --full:#3E9A5B; --prov:#D9741C; --full-soft:#1E3326; --prov-soft:#3D2A17; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:0;text-wrap:balance;margin:0;line-height:1.1}

header{background:var(--head);color:var(--head-ink)}
header .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:38px;height:38px;border-radius:6px;background:var(--yellow);color:#262626;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;flex:none}
.brand h1{font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.brand .sub{font-size:13px;color:var(--head-muted);display:block;letter-spacing:.06em;text-transform:uppercase}
.who{margin-left:auto;font-size:13px;color:var(--head-muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who b{color:var(--head-ink);font-weight:600}
.who .lvl{border-color:var(--head-muted)}
.who .lvl{border-color:transparent}
.who button{background:none;border:1px solid var(--head-muted);color:var(--head-ink);border-radius:4px;padding:1px 8px;font-size:12px;cursor:pointer}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;color:var(--head-muted);padding:10px 13px 12px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--head-ink)}
.tab[aria-selected="true"]{color:var(--head-ink);border-bottom-color:var(--yellow)}
.count{background:var(--yellow);color:#262626;border-radius:4px;font-size:12px;padding:0 7px;font-family:var(--f-mono);font-weight:600;line-height:18px}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,var(--charcoal) 10px 20px)}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.example,.banner.ann{background:var(--yellow-soft);border-color:transparent}
.banner b{font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.btn.primary:hover{filter:brightness(.95)}
.btn.dark{background:var(--charcoal);color:#F4F4F2;border-color:var(--charcoal)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.topline{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.topline h2{font-size:26px}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.topline .btn{margin-left:auto}

.foryou{background:var(--yellow-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.foryou h3{font-size:18px}
.fy{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;padding:4px 0}
.fy .fytext{flex:1;min-width:180px}

.strip{display:grid;grid-template-columns:repeat(14,minmax(44px,1fr));gap:4px;overflow-x:auto;padding-bottom:4px}
.dayb{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 2px 7px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:1px;align-items:center;min-width:0}
.dayb .w{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dayb .n{font-family:var(--f-mono);font-size:15px;font-weight:600}
.dayb .c{height:16px;display:flex;gap:2px;align-items:center;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pip{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.pip.full{background:var(--full)}
.pip.provisional{background:var(--prov)}
.pip.mine{outline:2px solid var(--ink);outline-offset:1px}
.dayb.closed{background:var(--sunk);border-style:dashed}
.dayb.closed .n{color:var(--muted)}
.dayb[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--charcoal);color:#F4F4F2;border-color:var(--charcoal)}
.chip .k{font-family:var(--f-mono);opacity:.7;margin-left:4px}

.group{display:flex;flex-direction:column;gap:10px}
.ghead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.ghead h3{font-size:20px}
.ghead span{font-size:13px;color:var(--muted)}
.trade{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:16px}
.trade.mine{border:2px solid var(--ink)}
.trade.taking{border:2px solid var(--ok)}
.trade.unavail{background:var(--sunk);border-style:dashed}
.trade.taken{background:var(--sunk);border-color:var(--line)}
.trade.taken .time,.trade.taken .person,.trade.taken .lvl,.trade.taken .note{opacity:.5}
.trade.unavail .time,.trade.unavail .person,.trade.unavail .lvl{opacity:.6}
.noway{font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.yours{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:2px 8px;background:var(--ink);color:var(--surface)}
.yours.taking{background:var(--ok);color:var(--surface)}
.trade.flash{box-shadow:0 0 0 2px var(--yellow)}
.trow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.time{font-family:var(--f-mono);font-size:19px;font-weight:600}
.lvl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:2px 7px;border:1px solid transparent}
.lvl.full{background:var(--full);color:#fff}
.lvl.provisional{background:var(--prov);color:#fff}
.person{display:inline-flex;align-items:center;gap:7px;font-weight:500;min-width:0}
.av{width:22px;height:22px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tag{font-size:12px;border-radius:4px;padding:2px 8px;font-weight:500;background:var(--sunk);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.y{background:var(--yellow-soft);color:var(--yellow-ink)}
.note{font-size:14px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub-block{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.sub-block h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.offer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.offer .what{flex:1;min-width:180px}
.offer .what small{display:block;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:6px 12px;cursor:pointer;font-size:14px;font-weight:500;display:flex;gap:6px;align-items:center}
.seg input{accent-color:var(--charcoal)}
.seg label:has(input:checked){background:var(--yellow-soft)}
textarea,select,input[type=date],input[type=text],input[type=password],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{accent-color:var(--charcoal);width:16px;height:16px}

.sums{background:var(--sunk);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.step{padding:3px 8px;border-radius:4px;background:var(--surface);color:var(--muted)}
.step.done{background:var(--ok-soft);color:var(--ok)}
.step.now{background:var(--yellow);color:var(--on-yellow)}
.sums code{font-family:var(--f-mono);font-size:13px;background:var(--surface);padding:8px 10px;border-radius:4px;display:block;overflow-wrap:anywhere;user-select:all}

.match{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;padding:6px 0}
.match .why{flex:1;min-width:160px;color:var(--muted);font-size:13px}
.star{color:var(--yellow-ink);font-weight:600}

/* per-trade discussion */
.disc{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.disc-row{display:flex;gap:10px;align-items:center;min-width:0}
.disc-toggle{display:inline-flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);flex:none}
.disc-toggle:hover{border-color:var(--muted);background:var(--sunk)}
.disc-toggle[aria-expanded="true"]{background:var(--sunk)}
.disc-toggle .new{background:var(--yellow);color:#262626;border-radius:4px;padding:0 6px;font-size:12px}
.disc-row .last{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tmsgs{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;background:var(--sunk);border-radius:6px;padding:10px}
.tmsg{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.tmsg .body{min-width:0;flex:1}
.tmsg .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.tmsg .meta b{color:var(--ink);font-size:13px}
.tmsg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.tmsg.ask .txt{border-left:3px solid var(--yellow);padding-left:8px}
.tmsg .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;margin-left:auto}
.tcomp{display:flex;gap:8px;align-items:flex-end}
.tcomp textarea{min-height:40px}

.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:4px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hrow h2{font-size:24px}
.saved{font-size:13px;color:var(--muted);margin-left:auto}
.gridwrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:56px repeat(7,minmax(38px,1fr));user-select:none;-webkit-user-select:none;min-width:320px}
.grid .dh{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:4px 0 6px;color:var(--muted)}
.grid .dh.off{text-decoration:line-through;opacity:.6}
.grid .tl{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-8px);height:28px}
.cell{height:28px;border:0;border-left:1px solid var(--line);border-top:1px solid var(--line);background:var(--surface);padding:0;cursor:pointer;touch-action:pan-y;position:relative}
.cell:hover{background:var(--yellow-soft)}
.cell.on{background:var(--yellow)}
.cell.on.top{box-shadow:inset 0 2px 0 var(--charcoal)}
.cell.will{background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.willmode .cell.on{background:var(--sunk);box-shadow:none;opacity:.7}
.grid:not(.willmode) .cell.will:disabled{background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok);opacity:.6;cursor:not-allowed}
.willmode .cell.on:disabled{background:repeating-linear-gradient(-45deg,var(--yellow-soft) 0 4px,var(--sunk) 4px 8px)}
.callout{background:var(--yellow-soft);border-radius:6px;padding:10px 12px;font-size:14px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.sw-shift{background:var(--yellow)}
.sw-will{background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.cell:disabled{cursor:not-allowed;background:repeating-linear-gradient(-45deg,var(--sunk) 0 4px,var(--surface) 4px 8px)}
.blocks{display:flex;gap:6px;flex-wrap:wrap}
.blk{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:6px;padding:4px 4px 4px 10px;font-size:13px}
.blk button{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px}
.blk button:hover{background:var(--surface);color:var(--warn)}
.hint{font-size:13px;color:var(--muted);margin:0}

.heat .cell .k{font-family:var(--f-mono);font-size:11px;position:absolute;inset:0;display:grid;place-items:center;color:var(--on-yellow)}
.heat .cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{width:18px;height:12px;display:inline-block;border-radius:2px}
.rlist{display:flex;flex-direction:column;gap:6px;font-size:14px}

.days7{display:flex;gap:6px;flex-wrap:wrap}
.days7 label{border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;gap:6px;align-items:center;cursor:pointer;font-weight:500}
.days7 label:has(input:checked){background:var(--yellow-soft);border-color:var(--yellow)}
.adm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.closure{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.lock{max-width:440px;display:flex;flex-direction:column;gap:12px}
.custom{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding-top:10px}

.scrim{position:fixed;inset:0;background:rgba(20,20,20,.55);display:grid;place-items:end center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:min(640px,100%);max-height:92%;overflow:auto;border-radius:12px 12px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{place-items:center}.sheet{border-radius:12px}}
.sheet h2{font-size:26px}
.occs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.occ{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.occ b{font-weight:600;font-size:14px}
.occ span{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.occ[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow-soft)}
.occ:disabled{opacity:.45;cursor:not-allowed}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.occdays{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto}
.occday{display:flex;flex-direction:column;gap:6px}
.occday b{font-size:14px}
.hours{display:flex;gap:6px;flex-wrap:wrap}
.hourb{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.hourb[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow-soft);font-weight:700}
.hourb:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.pick{background:var(--sunk);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--charcoal);color:#F4F4F2;padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.trade{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(3px)}to{transform:none}}}
@media (max-width:520px){.brand h1{font-size:24px}.who{margin-left:0;width:100%}.topline .btn{margin-left:0;width:100%}.tags{margin-left:0}}
</style>

</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true">IS</div>
      <div><h1>Shift Board</h1><span class="sub">Invention Studio · PI board</span></div>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
  <div class="stripe" aria-hidden="true"></div>
</header>
<main><div class="wrap" id="view"><div class="empty"><h3>Loading the board</h3><p>Open trades, your hours and the studio roster will appear here.</p></div></div></main>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
/* =====================================================================
   SUPABASE CONNECTION
   Paste these from Supabase → Project Settings → API (or the "Connect" button):
     SUPABASE_URL  the Project URL, like https://abcdefghij.supabase.co
     SUPABASE_KEY  the "anon public" (or "publishable") key. It's meant to be public;
                   the security rules in supabase-setup.sql protect the data.
   Leave them empty to see the board with example data only.
   ===================================================================== */

const cfg = () => ({...DEFAULT_CFG, ...(S.config||{})});
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const wd = d => (d.getDay()+6)%7;
const nowMin = () => { const d = new Date(); return d.getHours()*60+d.getMinutes(); };
const pm = m => (m%1440) >= 720;
function tm(m, suffix=true){ const h=Math.floor(m/60)%24, mm=m%60; return (h%12||12)+(mm?":"+pad(mm):"")+(suffix?(pm(m)?" PM":" AM"):""); }
function range(s,e){ return pm(s)===pm(e) ? `${tm(s,false)}–${tm(e)}` : `${tm(s)}–${tm(e)}`; }
function dayLabel(ds){ const d=parse(ds); return `${DAYS[wd(d)]} ${MONTHS[d.getMonth()]} ${d.getDate()}`; }
function daysAway(ds){ return Math.round((parse(ds)-today())/864e5); }
function rel(ds){ const n=daysAway(ds); return n===0?"Today":n===1?"Tomorrow":n<0?`${-n} days ago`:`in ${n} days`; }
function ago(s){ if(!s) return ""; const h=(Date.now()-new Date(s))/36e5; return h<1/60?"just now":h<1?`${Math.floor(h*60)}m ago`:h<24?`${Math.floor(h)}h ago`:`${Math.floor(h/24)}d ago`; }
function when(s){ const d=new Date(s), t=tm(d.getHours()*60+d.getMinutes()); return iso(d)===iso(today()) ? t : `${MONTHS[d.getMonth()]} ${d.getDate()}, ${t}`; }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const hoursUntil = t => (parse(t.date).getTime() + t.s*60000 - Date.now())/36e5;
const hasStarted = t => { const n=daysAway(t.date); return n<0 || (n===0 && t.s<=nowMin()); };
const lvlName = l => l==="full" ? "Full" : "Provisional";
const nowIso = () => new Date().toISOString();
function deepMerge(a,b){ for(const k in b){ if(b[k] && typeof b[k]==="object" && !Array.isArray(b[k]) && a[k] && typeof a[k]==="object") deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }
function isClosed(ds){ const c=cfg(); return !c.days[wd(parse(ds))] || (c.closures||[]).some(x=>ds>=x.from && ds<=x.to); }
function closureLabel(ds){ const x=(cfg().closures||[]).find(x=>ds>=x.from && ds<=x.to); return x ? (x.label||"Closed") : (!cfg().days[wd(parse(ds))] ? "Closed" : ""); }
const hourOpts = (sel, from, to) => { let o=""; for(let h=from; h<=to; h++) o+=`<option value="${h}" ${+sel===h?"selected":""}>${tm(h*60)}</option>`; return o; };

function willingThen(uid, date, s, e){ const d=wd(parse(date)); const w=S.pis[uid]?.willing||[]; for(let m=s;m<e;m+=SLOT){ if(!w.some(b=>b.d===d && b.s<=m && m<b.e)) return false; } return w.length>0; }
function worksThen(uid, date, s, e){ const d=wd(parse(date)); return (S.pis[uid]?.blocks||[]).some(b => b.d===d && b.s<e && s<b.e); }
function occurrences(uid){
  const out=[], blocks=S.pis[uid]?.blocks||[], t0=today(), c=cfg();
  for(let k=0;k<c.lookahead;k++){ const d=addDays(t0,k), ds=iso(d), w=wd(d);
    if(isClosed(ds)) continue;
    for(const b of blocks) if(b.d===w) for(let h=b.s; h<b.e; h+=SLOT) if(!(k===0 && h<=nowMin())) out.push({date:ds, s:h, e:h+SLOT}); }
  return out.sort((a,b)=>a.date.localeCompare(b.date)||a.s-b.s);
}

const activeTrades = () => Object.entries(S.trades).filter(([,t])=>t.status!=="cancelled" && !hasStarted(t));
const involvedIn = (id,t) => t.by===S.me || t.takerId===S.me || offersFor(id).some(([,o])=>o.by===S.me && o.status!=="withdrawn") || threadFor(id).some(([,m])=>m.by===S.me || m.to===S.me);
const unreadThread = id => { const seen=S.mine.seen?.["t:"+id]||""; return threadFor(id).filter(([,m])=>m.by!==S.me && m.created>seen).length; };

/* ---------- writes ---------- */
function toast(msg, ms=3200){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true, ms); }
function writeError(e){
  const c=e?.code;
  if(S.backend==="supa"){
    if(c==="42501") toast("You don't have permission to do that.",5000);
    else if(c==="P0001" && e.message) toast(e.message,5000);
    else toast("Couldn't save. Check your connection and try again.");
    return;
  }
  if(c==="invalid_argument" || c==="permission-denied"){ S.canWrite=false; toast("This board is view-only for you right now. Ask an admin for access.",5000); render(true); }
  else if(c==="quota_exceeded" || c==="resource-exhausted") toast("The board's storage is full or busy. Try again shortly.",5000);
  else toast("Couldn't save. Check your connection and try again.");
}
/* Storage layout (kept small so each page open costs only a few reads):
   board/roster   one document holding every PI:  { pis: { <id>: {name, level, blocks, owner} } }
   trades/<id>    one document per trade, with its offers and discussion inside:
                  { by, level, date, s, e, status, …, offers: { <id>: {...} }, msgs: { <id>: {...} } }
   config/studio  studio settings (admins only)
   The page unpacks these into S.pis, S.trades, S.offers and S.msgs, so the rest of the code
   works with simple lists; write() and remove() pack changes back into the right document. */
const DEL = Object.freeze({__delete:true});
function isPlain(v){ return v && typeof v==="object" && !Array.isArray(v) && Object.getPrototypeOf(v)===Object.prototype; }
function nullDeep(v){ if(v===DEL) return null; if(isPlain(v)){ const o={}; for(const k in v) o[k]=nullDeep(v[k]); return o; } return v; }
async function patchDoc(col,id,nested){
  const ref=S.db.collection(col).doc(id);
  if(col==="board" && !S.rosterExists){ await ref.set(nullDeep(nested)); S.rosterExists=true; }
  else await ref.update(nullDeep(nested));
}
/* ---------- Supabase storage: one row per item, fields kept in a JSON "data" column ---------- */
function localApply(col,id,data,trade){
  if(col==="config"){ if(id==="studio") S.config=data; return; }
  if(col==="offers") S.offers[id]={...data, trade};
  else if(col==="msgs") S.msgs[id]={...data, trade, ch:"t:"+trade};
  else S[col][id]=data;
}
function localRemove(col,id){
  delete S[col][id];
  if(col==="trades"){
    for(const [k,o] of Object.entries(S.offers)) if(o.trade===id) delete S.offers[k];
    for(const [k,m] of Object.entries(S.msgs)) if(m.trade===id) delete S.msgs[k];
  }
}
async function supaWrite(col,id,data,merge){
  try{
    const sub = col==="offers" || col==="msgs";
    let trade, body=structuredClone(data);
    if(sub){
      trade = data.trade || S[col][id]?.trade;
      if(!trade || !S.trades[trade]){ toast("That trade isn't on the board anymore."); return false; }
      delete body.trade; delete body.ch;
    }
    const before = col==="config" ? (S.config||{}) : (S[col][id]||{});
    const res = merge
      ? await S.sb.rpc("patch_row", {tbl:col, rid:id, patch:body})
      : await S.sb.from(col).upsert(sub ? {id, trade, data:body} : {id, data:body});
    if(res.error) throw res.error;
    localApply(col, id, merge ? deepMerge(structuredClone(before), body) : body, trade);
    render(); return true;
  }catch(e){ writeError(e); return false; }
}
async function supaRemove(col,id){
  const key = col==="admins" ? "uid" : "id";
  const { error } = await S.sb.from(col).delete().eq(key, id);
  if(error){ writeError(error); return false; }
  if(col!=="admins") localRemove(col,id);
  render(); return true;
}
async function write(col,id,data,merge=false){
  if(S.backend==="supa" && S.mode==="live") return supaWrite(col,id,data,merge);
  if(S.mode!=="live"){
    if(col==="config") S.config = merge ? deepMerge(structuredClone(S.config||{}),data) : structuredClone(data);
    else S[col][id] = merge ? deepMerge(structuredClone(S[col][id]||{}), data) : structuredClone(data);
    render(); return true;
  }
  try{
    if(col==="config"){ const ref=S.db.collection("config").doc(id); merge ? await ref.update(data) : await ref.set(data); }
    else if(col==="trades" && !merge) await S.db.collection("trades").doc(id).set({...data, offers:{}, msgs:{}});
    else if(col==="trades") await patchDoc("trades", id, data);
    else if(col==="pis") await patchDoc("board", "roster", {pis:{[id]:data}});
    else if(col==="offers" || col==="msgs"){
      const tid = data.trade || S[col][id]?.trade;
      if(!tid || !S.trades[tid]){ toast("That trade isn't on the board anymore."); return false; }
      const body={...data}; delete body.trade; delete body.ch;
      await patchDoc("trades", tid, {[col]:{[id]:body}});
    }
    return true;
  }catch(e){ writeError(e); return false; }
}
async function remove(col,id){
  if(S.backend==="supa" && S.mode==="live"){ await supaRemove(col,id); return; }
  if(S.mode!=="live"){ delete S[col][id]; render(); return; }
  try{
    if(col==="trades") await S.db.collection("trades").doc(id).delete();
    else if(col==="pis") await patchDoc("board","roster",{pis:{[id]:DEL}});
    else if(col==="offers" || col==="msgs"){ const tid=S[col][id]?.trade; if(tid && S.trades[tid]) await patchDoc("trades",tid,{[col]:{[id]:DEL}}); }
  }catch(e){ if(col==="pis") writeError(e); }
}

function markThreadSeen(tid){

/* trades disappear once their start time passes; their offers and discussion go with them */
let purging=false;
async function purgePast(){
  if(purging || S.mode!=="live" || !S.canWrite || !S.loaded.trades) return;
  purging=true;
  try{ for(const [id,t] of Object.entries(S.trades)) if(hasStarted(t) || t.status==="cancelled") await remove("trades",id); }
  finally { purging=false; }
}

let rv=0, pending=false;
/* Live updates redraw the page. Hold off only while someone is actively typing,
   then redraw and put their cursor back where it was. */
let lastInput=0;
document.addEventListener("input", ()=>{ lastInput=Date.now(); }, true);
function typing(){ const a=document.activeElement; return a && a.closest && a.closest("#view") && /^(INPUT|TEXTAREA)$/.test(a.tagName) && Date.now()-lastInput<2500; }
function fieldKey(el){ if(!el || !el.closest || !el.closest("#view")) return null; if(el.id) return "#"+CSS.escape(el.id); for(const a of ["data-adm","data-draft","data-tc"]) if(el.hasAttribute(a)) return `[${a}="${CSS.escape(el.getAttribute(a))}"]${el.dataset.k?`[data-k="${CSS.escape(el.dataset.k)}"]`:""}`; return null; }
async function render(force){

/* ----- board ----- */
function boardView(P){
  const me=S.me, lvl=myLevel();
  const live = activeTrades();
  const takeable = ([,t]) => t.status==="open" && t.by!==me && !blockedReason(t);
  const open = live.filter(([,t])=>t.status==="open");
  const counts = { all: live.filter(([id,t])=>t.status!=="done"||involvedIn(id,t)).length, take: live.filter(takeable).length,
    full: open.filter(([,t])=>t.level==="full").length, provisional: open.filter(([,t])=>t.level==="provisional").length,
    mine: live.filter(([id,t])=>involvedIn(id,t)).length };
  let list = live.filter(([id,t]) => {
    if(ui.filter==="take") return takeable([id,t]);
    if(ui.filter==="mine") return involvedIn(id,t);
    if(ui.filter==="full"||ui.filter==="provisional") return t.status==="open" && t.level===ui.filter;
    return t.status!=="done" || involvedIn(id,t);
  });
  if(ui.day) list = list.filter(([,t])=>t.date===ui.day);
  list.sort((a,b)=>a[1].date.localeCompare(b[1].date)||a[1].s-b[1].s);

  const t0=today(); let strip="";
  for(let k=0;k<14;k++){ const d=addDays(t0,k), ds=iso(d), w=wd(d), closed=isClosed(ds);
    const here = open.filter(([,t])=>t.date===ds);
    const pips = closed ? "Closed" : here.slice(0,4).map(([,t])=>`<span class="pip ${t.level} ${t.by===me?"mine":""}"></span>`).join("") + (here.length>4?`<span class="mono">+${here.length-4}</span>`:"");
    strip += `<button class="dayb ${closed?"closed":""}" data-act="day" data-v="${ds}" aria-pressed="${ui.day===ds}" aria-label="${dayLabel(ds)}, ${closed?esc(closureLabel(ds)):here.length+" open"}" title="${esc(closed?closureLabel(ds):"")}"><span class="w">${k===0?"Today":DAYS[w]}</span><span class="n">${d.getDate()}</span><span class="c">${pips}</span></button>`;
  }
  const chip = (k,l) => `<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${ui.filter===k}">${l}<span class="k">${counts[k]}</span></button>`;
  const fy = forYou();
  const fyHTML = fy.length ? `<section class="foryou" aria-label="Needs you"><h3>Needs you</h3>${fy.map(x=>`<div class="fy">${x.ask?av(P,x.ask):""}<span class="fytext">${x.ask?`<b>${nm(P,x.ask)}</b> `:""}${esc(x.text)}</span><button class="btn sm" data-act="goto" data-v="${x.id}" data-thread="${x.thread||x.ask?1:0}">${x.act}</button></div>`).join("")}</section>` : "";

  let body="";
  if(!list.length){
    body = live.length===0
      ? `<div class="empty"><h3>No trades posted</h3><p>When a PI needs a shift covered, it shows up here. Need one yourself? Use <b>Request a trade</b>.</p></div>`
      : `<div class="empty"><h3>Nothing matches</h3><p>Try another filter${ui.day?" or clear the day":""}.</p></div>`;
  } else {
    const groups={}; list.forEach(x=>(groups[x[1].date]??=[]).push(x));
    for(const [ds,items] of Object.entries(groups))
      body += `<section class="group"><div class="ghead"><h3>${dayLabel(ds)}</h3><span>${rel(ds)}</span></div>${items.map(([id,t])=>tradeCard(id,t,P)).join("")}</section>`;
  }
  return `
  <div class="topline">
    <div><h2>Open shifts</h2>
      <div class="stats"><span><b>${open.length}</b> open</span><span><b>${counts.take}</b> available to you</span></div></div>
    <button class="btn primary" data-act="open-request" ${!S.canWrite?"disabled":""}>Request a trade</button>
  </div>
  ${fyHTML}
  <div class="strip" role="group" aria-label="Next two weeks">${strip}</div>
  <div class="chips" role="group" aria-label="Filter">${chip("all","All")}${chip("take","Available")}${chip("full","Full")}${chip("provisional","Provisional")}${chip("mine","Mine")}${ui.day?`<button class="chip" data-act="day" data-v="${ui.day}">${dayLabel(ui.day)} ✕</button>`:""}</div>
  ${body}
  <p class="hint">Trades come off the board automatically once their start time passes.</p>`;
}

function tradeCard(id,t,P){
  const me=S.me, mine=t.by===me, lvl=myLevel(), offers=offersFor(id), W=S.canWrite;
  const pendingOffers = offers.filter(([,o])=>o.status==="pending");
  const tags=[];
  if(t.status==="open" && hoursUntil(t)<cfg().urgentHours) tags.push(`<span class="tag warn">Urgent · ${Math.max(1,Math.round(hoursUntil(t)))}h</span>`);
  const blocked = t.status==="open" && !mine ? blockedReason(t) : null;
  if(t.status==="open" && !mine && !blocked) tags.push(willingThen(me,t.date,t.s,t.e) ? `<span class="tag ok">Matches your availability</span>` : `<span class="tag ok">Available to you</span>`);
  if(t.status==="open" && pendingOffers.length) tags.push(`<span class="tag y">${pendingOffers.length} offer${pendingOffers.length>1?"s":""}</span>`);
  if(t.status==="agreed") tags.push((mine||t.takerId===me) ? `<span class="tag y">Agreed · SUMS pending</span>` : `<span class="tag">Taken</span>`);
  if(t.status==="done") tags.push(`<span class="tag ok">In SUMS</span>`);
  const wants = (t.wants||[]).filter(w=>daysAway(w.date)>=0);
  const wantsLine = wants.length ? `<div class="trow" style="font-size:13px"><span class="muted">Prefers in return:</span>${wants.map(w=>`<span class="tag">${dayLabel(w.date)} ${range(w.s,w.e)}</span>`).join("")}</div>` : "";

  let acts="";
  if(t.status==="open" && mine){
    if(pendingOffers.length) acts += `<div class="sub-block"><h4>Offers on your shift</h4>${pendingOffers.map(([oid,o])=>`<div class="offer"><div class="what">${who(P,o.by)} ${o.kind==="swap"?`wants to swap for <b class="mono">${dayLabel(o.swapDate)} ${range(o.swapS,o.swapE)}</b>`:"will cover it"}${o.note?`<small>“${esc(o.note)}”</small>`:""}</div>${W?`<button class="btn primary" data-act="accept" data-v="${oid}">Accept</button>`:""}</div>`).join("")}</div>`;
    if(ui.finder===id) acts += finderHTML(id,t,P);
    if(W) acts += `<div class="acts">
      <button class="btn ${pendingOffers.length?"":"dark"}" data-act="finder" data-v="${id}">${ui.finder===id?"Hide":"Find cover"}</button>
      <button class="btn ghost danger" data-act="cancel" data-v="${id}">${ui.confirm==="c"+id?"Confirm remove":"Remove"}</button></div>`;
  } else if(t.status==="open"){
    const myOffer = offers.find(([,o])=>o.by===me && o.status==="pending");
    if(blocked) acts = `<div class="noway"><span aria-hidden="true">⊘</span> Not available to you: ${esc(blocked)}</div>`;
    else if(myOffer) acts = `<div class="acts"><span class="hint">You offered to ${myOffer[1].kind==="swap"?`swap for ${dayLabel(myOffer[1].swapDate)} ${range(myOffer[1].swapS,myOffer[1].swapE)}`:"cover it"}. Waiting on ${nm(P,t.by)}.</span>${W?`<button class="btn ghost" data-act="withdraw" data-v="${myOffer[0]}">Cancel offer</button>`:""}</div>`;
    else if(W && ui.offering===id) acts = offerForm(id,t);
    else if(W) acts = `<div class="acts"><button class="btn dark" data-act="offer-open" data-v="${id}">Take shift</button></div>`;
  } else {
    const o = S.offers[t.acceptedOffer], involved = mine || t.takerId===me;
    if(involved){
      const sb=t.sumsBy||{}, other = mine?t.takerId:t.by, done = t.status==="done";
      acts = `<div class="sums">
        <div class="steps"><span class="step done">1 · Agreed</span><span class="step ${done?"done":"now"}">2 · Enter in SUMS</span><span class="step ${done?"done":""}">3 · Both confirm</span></div>
        <code>${esc(sumsText(t,o,P))}</code>
        <div class="acts">
          <button class="btn ghost" data-act="copy-sums" data-v="${id}">Copy for SUMS</button>
          ${done?`<span class="hint">Both of you confirmed it's in SUMS.</span>`
            : sb[me] ? `<span class="hint">You confirmed. Waiting on ${nm(P,other)}.</span>`
            : W ? `<button class="btn primary" data-act="sums" data-v="${id}">Done in SUMS</button>${sb[other]?`<span class="hint">${nm(P,other)} already confirmed.</span>`:""}` : ""}
        </div></div>`;
    } else acts = `<p class="hint">Taken by ${nm(P,t.takerId)}.</p>`;
  }
  const taking = !mine && t.takerId===me && (t.status==="agreed"||t.status==="done");
  const taken = (t.status==="agreed" && !mine && !taking) || t.status==="done";
  return `<article class="trade ${mine?"mine":""} ${taking?"taking":""} ${blocked?"unavail":""} ${taken?"taken":""}" id="tr-${id}">
    <div class="trow">${mine?`<span class="yours">Your shift</span>`:taking?`<span class="yours taking">You're taking this</span>`:""}<span class="time">${range(t.s,t.e)}</span><span class="lvl ${t.level}">${lvlName(t.level)}</span><div class="tags">${tags.join("")}</div></div>
    <div class="trow">${mine?`<span class="muted" style="font-size:13px">You posted this ${ago(t.created)}. Others can offer to take it.</span>`:`${who(P,t.by)}<span class="muted" style="font-size:13px">needs this covered · posted ${ago(t.created)}</span>`}</div>
    ${t.note?`<p class="note">“${esc(t.note)}”</p>`:""}
    ${wantsLine}
    ${acts}
    ${discussionHTML(id,t,P)}
  </article>`;
}
function discussionHTML(id,t,P){
  const list=threadFor(id), open=ui.threads.has(id), u=unreadThread(id), last=list[list.length-1]?.[1];
  const label = open ? "Hide" : list.length ? `Discussion (${list.length})` : "Discussion";
  let inner="";
  if(open){
    const canDel = m => (m.by===S.me && S.canWrite) || (ui.admin && S.canWrite);
    inner = `${list.length?`<div class="tmsgs" id="tm-${id}">${list.map(([mid,m])=>`<div class="tmsg ${m.kind==="ask"?"ask":""}">${av(P,m.by)}<div class="body"><div class="meta"><b>${nm(P,m.by)}</b>${m.to?`<span>to ${nm(P,m.to)}</span>`:""}<span>${when(m.created)}</span>${canDel(m)?`<button class="del" data-act="del-msg" data-v="${mid}" aria-label="Delete message">${ui.confirm==="m"+mid?"Delete?":"✕"}</button>`:""}</div><div class="txt">${esc(m.text)}</div></div></div>`).join("")}</div>`:`<p class="hint">No messages yet. Ask about the shift or coordinate details here.</p>`}
      ${S.canWrite?`<div class="tcomp"><textarea id="tc-${id}" data-tc="${id}" rows="1" placeholder="Write a message about this trade" aria-label="Message about this trade">${esc(ui.tdraft[id]||"")}</textarea><button class="btn primary" data-act="tsend" data-v="${id}">Post</button></div>`:""}`;
  }
  return `<div class="disc"><div class="disc-row"><button class="disc-toggle" data-act="thread" data-v="${id}" aria-expanded="${open}">${label}${u&&!open?`<span class="new">${u} new</span>`:""}</button>${!open && last?`<span class="last">${nm(P,last.by)}: ${esc(last.text)}</span>`:""}</div>${inner}</div>`;
}
function sumsText(t,o,P){
  const a=P[t.by]?.name||"PI", b=P[t.takerId]?.name||"PI";
  let s=`${a} → ${b}: ${dayLabel(t.date)}, ${range(t.s,t.e)} (${lvlName(t.level)})`;
  if(o?.kind==="swap") s += `  |  ${b} → ${a}: ${dayLabel(o.swapDate)}, ${range(o.swapS,o.swapE)}`;
  return s;
}

/* coverage finder */
function candidates(t){
  const out=[], wants=(t.wants||[]).filter(w=>daysAway(w.date)>=0);
  for(const [uid,p] of Object.entries(S.pis)){
    if(uid===t.by || !p.level || !canTakeLevel(p.level,t.level)) continue;
    if(worksThen(uid,t.date,t.s,t.e) || !willingThen(uid,t.date,t.s,t.e)) continue;
    const occ=occurrences(uid);
    const hits=wants.map(w=>({w, o:occ.find(o=>o.date===w.date && o.s<w.e && w.s<o.e)})).filter(x=>x.o);
    out.push({uid, hits, score:hits.length});
  }
  return out.sort((a,b)=>b.score-a.score);
}
const askedAlready = (tid, uid) => threadFor(tid).some(([,m])=>m.kind==="ask" && m.by===S.me && m.to===uid);
function finderHTML(id,t,P){
  const c=candidates(t);
  const offered = new Set(offersFor(id).filter(([,o])=>o.status==="pending").map(([,o])=>o.by));
  const row = x => {
    const why = x.hits.length ? `<span class="star">★ Works ${x.hits.map(h=>`${dayLabel(h.o.date)} ${range(h.o.s,h.o.e)}`).join(", ")}</span>, a shift you'd take back` : "Marked this hour as willing";
    const btn = offered.has(x.uid) ? `<span class="tag y">Offered</span>`
      : askedAlready(id,x.uid) ? `<span class="tag">Asked</span>`
      : `<button class="btn sm" data-act="ask" data-v="${id}|${esc(x.uid)}">Ask</button>`;
    return `<div class="match">${who(P,x.uid)}<span class="lvl ${S.pis[x.uid].level}">${lvlName(S.pis[x.uid].level)}</span><span class="why">${why}</span>${btn}</div>`;
  };
  return `<div class="sub-block"><h4>Willing to cover</h4>
    <p class="hint">${lvlName(t.level)} PIs who marked ${DAYS[wd(parse(t.date))]} ${range(t.s,t.e)} as an hour they'd pick up.${c.some(x=>x.hits.length)?" ★ also works a shift you'd take in return.":""} Asking posts in this trade's discussion.</p>
    ${c.length ? c.map(row).join("") : `<p class="hint">No one has marked this hour as willing yet. Your request is still on the board for anyone to take, and you can ask in the discussion.</p>`}
  </div>`;
}
function offerForm(id,t){
  const d = ui.draft[id] ||= {kind:(t.wants||[]).length?"swap":"cover", swap:"", note:""};
  const mineOcc = occurrences(S.me).filter(x=>x.date!==t.date || x.s!==t.s);

      : `<p class="hint">You have no upcoming shifts to swap. Add your hours first.</p>`) : ""}
    <label class="field">Note (optional)<textarea id="note-${id}" data-draft="${id}" data-k="note" placeholder="e.g. I can stay an extra hour if that helps">${esc(d.note)}</textarea></label>

/* ----- hours ----- */
function blocksToSlots(blocks){ const s=new Set(); for(const b of blocks||[]) for(let m=Math.floor(b.s/60)*60; m<b.e; m+=SLOT) s.add(`${b.d}-${m/60}`); return s; }
function slotsToBlocks(set){
  const out=[];
  for(let d=0;d<7;d++){ let start=null;
    for(let h=0;h<=24;h++){ const on=h<24 && set.has(`${d}-${h}`);
      if(on && start===null) start=h;
      if(!on && start!==null){ out.push({d, s:start*60, e:h*60}); start=null; } } }
  return out;
}
function hoursView(P){
  const c=cfg(), uid=ui.editing||S.me, pi=S.pis[uid];
  if(!ui.dirty){ ui.slots = blocksToSlots(pi?.blocks); ui.wslots = blocksToSlots(pi?.willing); }

  const total = blocks.reduce((a,b)=>a+(b.e-b.s),0)/60;

    g += `<div class="tl">${tm(h*60)}</div>`;

      const k=`${d}-${h}`, sh=ui.slots.has(k), wi=ui.wslots.has(k), off=!c.days[d];

      const locked = W ? sh : wi; // an hour is either a shift or a willing hour, never both
      const label = `${DAYS_LONG[d]} ${range(h*60,h*60+60)}${sh?", your shift":wi?", willing to pick up":""}${off?", studio closed":""}`;
      g += `<button class="cell ${sh?"on":""} ${wi?"will":""} ${top?"top":""} ${(W&&sh)||(!W&&wi)?"dim":""}" data-slot="${k}" aria-pressed="${on}" aria-label="${label}" ${!S.canWrite||off||locked?"disabled":""}></button>`;
    }
  }
  return `${editBar}<div class="panel">
    <div class="hrow"><h2>${ui.editing?"Profile":"My profile"}</h2></div>
    <div class="custom" style="padding-top:0"><label class="field">Name<input type="text" id="pf-name" maxlength="60" value="${esc(pi?.name||"")}" placeholder="First Last" ${!S.canWrite?"disabled":""}></label><button class="btn" data-act="save-name" ${!S.canWrite?"disabled":""}>Save name</button></div>
    <div class="field">Shift type
      <div class="seg" role="radiogroup" aria-label="Shift type">
        <label><input type="radio" name="lvl" value="full" data-act-change="level" ${lvl==="full"?"checked":""} ${!S.canWrite?"disabled":""}>Full PI</label>
        <label><input type="radio" name="lvl" value="provisional" data-act-change="level" ${lvl==="provisional"?"checked":""} ${!S.canWrite?"disabled":""}>Provisional PI</label>
      </div></div>
    <p class="hint">${c.fullTakesProv?"Full PIs can take Full or Provisional shifts. Provisional PIs take Provisional shifts.":"PIs can only take trades of their own shift type."}</p>
  </div>
  <div class="panel">
    <div class="hrow"><h2>${whose} week</h2><span class="saved" id="saved">${esc(ui.saveState)}</span></div>
    <div class="seg layer" role="radiogroup" aria-label="What you're marking">
      <label><input type="radio" name="layer" value="shifts" data-act-change="layer" ${!W?"checked":""}><i class="sw sw-shift"></i>My shifts <span class="muted">(${nShifts})</span></label>
      <label><input type="radio" name="layer" value="willing" data-act-change="layer" ${W?"checked":""}><i class="sw sw-will"></i>Willing to pick up <span class="muted">(${nWill})</span></label>
    </div>
    <p class="hint">${W ? "Mark hours you'd be happy to cover if someone asks. Only people who mark an hour show up when someone uses Find cover for it. Your own shifts are greyed out here."
      : "Each box is a one-hour shift. Mark the hours you work every week. Click or drag; tap on a phone. Hours marked as willing to pick up are locked here; clear them in Willing to pick up first. Changes save on their own."}</p>
    ${!W?`<div class="callout"><b>Masters, exec and directors:</b> only put your Full PI shift here.</div>`:""}

/* ---------- copy ---------- */
function copy(text){
  const fallback=()=>toast("Copy blocked here. Select the text: "+text, 7000);
  try{ navigator.clipboard.writeText(text).then(()=>toast("Copied"), fallback); }catch(e){ fallback(); }
}
function viewTrade(id, openThread){ if(!S.trades[id]) return; ui.tab="board"; ui.filter="all"; ui.day=null; ui.flash=id; if(openThread) ui.threads.add(id); render(true); }

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  if(act==="close-modal" && el.classList.contains("scrim") && e.target!==el) return;
  const keepConfirm = ["cancel","clear-hours","adm-rm-trade","del-msg","adm-rm-pi","adm-rm-examples","rm-admin"].includes(act);
  if(!keepConfirm) ui.confirm=null;
  switch(act){
    case "tab": ui.tab=v; ui.editing=null; ui.dirty=false; ui.rosterCell=null; if(v==="admin") ui.adminDraft=null; render(true); break;
    case "filter": ui.filter=v; render(true); break;
    case "day": ui.day = ui.day===v?null:v; render(true); break;
    case "goto": viewTrade(v, el.dataset.thread==="1"); break;
    case "thread": ui.threads.has(v)?ui.threads.delete(v):ui.threads.add(v); render(true); if(ui.threads.has(v)) setTimeout(()=>document.getElementById("tc-"+v)?.focus(),0); break;
    case "tsend": { const ta=document.getElementById("tc-"+v); if(ta && await postMsg(v, ta.value)){ delete ui.tdraft[v]; ta.value=""; render(true); setTimeout(()=>document.getElementById("tc-"+v)?.focus(),0); } break; }
    case "del-msg":
      if(ui.confirm!=="m"+v){ ui.confirm="m"+v; render(true); break; }
      ui.confirm=null; await remove("msgs", v); break;
    case "offer-open": ui.offering=v; render(true); break;
    case "offer-close": ui.offering=null; render(true); break;
    case "finder": ui.finder = ui.finder===v?null:v; render(true); break;
    case "offer-send": {
      const t=S.trades[v], d=ui.draft[v]||{kind:"cover"};
      if(!t || t.status!=="open"){ toast("That trade isn't open anymore."); break; }
      if(blockedReason(t)){ toast("You can't take this one: "+blockedReason(t)+"."); break; }
      const o={ trade:v, by:S.me, kind:d.kind, note:(d.note||"").trim().slice(0,400), status:"pending", created:nowIso() };
      if(d.kind==="swap"){ if(!d.swap){ toast("Choose the shift you'd give them."); break; } const [sd,ss,se]=d.swap.split("|"); Object.assign(o,{swapDate:sd,swapS:+ss,swapE:+se}); }
      ui.offering=null; delete ui.draft[v];
      if(await write("offers", newId(), o)) toast("Offer sent");
      render(true); break; }
    case "withdraw": await write("offers", v, {status:"withdrawn"}, true); toast("Offer withdrawn"); break;
    case "accept": {
      const o=S.offers[v]; if(!o) break;
      if(await write("trades", o.trade, {status:"agreed", acceptedOffer:v, takerId:o.by, agreedAt:nowIso()}, true)){
        await write("offers", v, {status:"accepted"}, true); ui.finder=null;
        toast("Accepted. Now enter it in SUMS.");
      } break; }
    case "cancel":
      if(ui.confirm!=="c"+v){ ui.confirm="c"+v; render(true); break; }
      ui.confirm=null; await write("trades", v, {status:"cancelled"}, true); toast("Request removed"); purgePast(); break;
    case "sums": {
      const t=S.trades[v]; if(!t) break;
      const sb={...(t.sumsBy||{}), [S.me]:true}, both = sb[t.by] && sb[t.takerId];
      await write("trades", v, both?{sumsBy:{[S.me]:true}, status:"done"}:{sumsBy:{[S.me]:true}}, true);
      toast(both?"Trade complete":"Marked as entered"); break; }
    case "copy-sums": { const t=S.trades[v]; const P=await people([t.by,t.takerId],true); copy(sumsText(t,S.offers[t.acceptedOffer],P)); break; }
    case "ask": {
      const [tid,uid]=v.split("|"), t=S.trades[tid]; if(!t) break;
      const P=await people([uid],true);
      const hit=candidates(t).find(x=>x.uid===uid)?.hits?.[0];
      const text=`${P[uid]?.name||"Hi"}, can you take this shift?${hit?` I could take your ${dayLabel(hit.o.date)} ${range(hit.o.s,hit.o.e)} in return.`:""}`;
      if(await postMsg(tid, text, {kind:"ask", to:uid})){ ui.threads.add(tid); toast("Asked in this trade's discussion"); }
      render(true); break; }
    case "open-request": ui.modal={}; renderModal(); break;
    case "close-modal": ui.modal=null; renderModal(); break;
    case "close-and-find": ui.modal=null; renderModal(); ui.finder=v; viewTrade(v); break;
    case "pick": {
      syncModalInputs(); const [d,st]=v.split("|"), k=`${d}|${st}`, m=ui.modal;
      if(m.picks[k]) delete m.picks[k]; else m.picks[k]={date:d, s:+st, e:+st+SLOT};
      renderModal(); break; }
    case "pick-custom": {
      syncModalInputs(); const m=ui.modal;
      if(!m.cdate){ toast("Choose a date."); break; }
      if(daysAway(m.cdate)<0 || (daysAway(m.cdate)===0 && m.cs*60<=nowMin())){ toast("Pick a time that hasn't started yet."); break; }
      if(isClosed(m.cdate)){ toast("The studio is closed that day."); break; }
      m.picks[`${m.cdate}|${m.cs*60}`]={date:m.cdate, s:m.cs*60, e:m.cs*60+SLOT}; renderModal(); break; }
    case "add-want": {
      syncModalInputs(); const m=ui.modal;
      if(!m.wdate){ toast("No open days to choose from."); break; }
      if(!m.wants.some(w=>w.date===m.wdate && w.s===m.ws*60)) m.wants.push({date:m.wdate, s:m.ws*60, e:m.ws*60+SLOT});
      renderModal(); break; }
    case "rm-want": syncModalInputs(); ui.modal.wants.splice(+v,1); renderModal(); break;
    case "post": {
      syncModalInputs(); const m=ui.modal, posted=[];
      const picks=Object.values(m.picks).sort((a,b)=>a.date.localeCompare(b.date)||a.s-b.s);
      for(const p of picks){
        const id=newId();
        const t={ by:S.me, level:m.level||myLevel()||"provisional", date:p.date, s:p.s, e:p.e, note:(m.note||"").trim().slice(0,400), wants:m.wants||[], status:"open", created:nowIso(), startsAt: parse(p.date).getTime()+p.s*60000 };
        if(await write("trades", id, t)) posted.push({...t,id}); else break;
      }
      if(posted.length){ ui.modal={posted}; renderModal(); render(true); }
      break; }
    case "rm-block": { const set=curSet(), b=slotsToBlocks(set)[+v]; for(let m=b.s;m<b.e;m+=SLOT) set.delete(`${b.d}-${m/60}`); ui.dirty=true; render(true); scheduleSave(); break; }
    case "clear-hours":
      if(ui.confirm!=="clear"){ ui.confirm="clear"; render(true); break; }
      ui.confirm=null; (ui.layer==="willing"?ui.wslots:ui.slots).clear(); ui.dirty=true; render(true); scheduleSave(); break;
    case "admin-demo": ui.admin=true; ui.adminDraft=null; render(true); break;
    case "admin-signin": {
      const em=document.getElementById("adm-email")?.value.trim(), pw=document.getElementById("adm-pw")?.value||"";
      if(!em || !pw){ toast("Enter your admin email and password."); break; }
      const { error } = await S.sb.auth.signInWithPassword({email:em, password:pw});
      if(error){ toast(/rate|too many/i.test(error.message||"") ? "Too many attempts. Wait a few minutes and try again." : "That email and password didn't work."); break; }
      if(await checkAdmin()){ ui.adminDraft=null; toast("Signed in as admin"); render(true); }
      else { toast("That account isn't on the admin list."); await S.sb.auth.signOut(); await S.sb.auth.signInAnonymously(); await checkAdmin(); }
      break; }
    case "lock":
      if(S.backend==="supa"){ try{ await S.sb.auth.signOut(); await S.sb.auth.signInAnonymously(); await checkAdmin(); }catch(e){} }
      ui.admin=false; ui.tab="board"; render(true); break;
    case "adm-save": {
      const d=ui.adminDraft; if(d.close<=d.open){ toast("Closing time must be after opening time."); break; }
      if(await write("config","studio",structuredClone(d))) toast("Settings saved");
      ui.adminDraft=null; render(true); break; }
    case "adm-add-closure": {
      const f=document.getElementById("cl-from").value, t=document.getElementById("cl-to").value||f, l=document.getElementById("cl-label").value.trim();
      if(!f){ toast("Choose a start date."); break; } if(t<f){ toast("The end date is before the start date."); break; }
      ui.adminDraft.closures=[...(ui.adminDraft.closures||[]), {from:f,to:t,label:l}].sort((a,b)=>a.from.localeCompare(b.from)); render(true); break; }
    case "adm-rm-closure": ui.adminDraft.closures.splice(+v,1); render(true); break;
    case "adm-rm-trade":
      if(ui.confirm!=="a"+v){ ui.confirm="a"+v; render(true); break; }
      ui.confirm=null; await write("trades",v,{status:"cancelled"},true); toast("Trade removed"); purgePast(); break;
    case "adm-edit-pi": ui.editing = v===S.me ? null : v; ui.dirty=false; ui.saveState=""; ui.tab="hours"; window.scrollTo(0,0); render(true); break;
    case "end-edit": ui.editing=null; ui.dirty=false; ui.saveState=""; ui.tab="admin"; render(true); break;
    case "adm-add-pi": {
      const n=document.getElementById("np-name")?.value.trim(), l=document.getElementById("np-lvl")?.value||"full";
      if(!n){ toast("Enter a name."); break; }
      const id="pi-"+newId();
      if(await write("pis", id, {name:n.slice(0,60), level:l, blocks:[], updated:nowIso()})){ toast(`Added ${n}. Now set their hours.`); ui.editing=id; ui.dirty=false; ui.tab="hours"; render(true); }
      break; }
    case "adm-rm-pi":
      if(ui.confirm!=="r"+v){ ui.confirm="r"+v; render(true); break; }
      ui.confirm=null; await removePI(v); toast("Removed from the roster"); render(true); break;
    case "adm-rm-examples": {
      if(ui.confirm!=="ex"){ ui.confirm="ex"; render(true); break; }
      ui.confirm=null; toast("Removing example data…", 8000);
      if(S.mode!=="live"){ for(const col of ["msgs","offers","trades","pis"]) for(const [id,x] of Object.entries(S[col])) if(x.example) await remove(col,id); }
      else {
        for(const [id,t] of Object.entries(S.trades)) if(t.example) await remove("trades",id);
        for(const [id,m] of Object.entries(S.msgs)) if(m.example && !S.trades[m.trade]?.example) await remove("msgs",id);
        for(const [id,o] of Object.entries(S.offers)) if(o.example && !S.trades[o.trade]?.example) await remove("offers",id);
        const ex=Object.keys(S.pis).filter(id=>S.pis[id].example);
        if(ex.length){ if(S.backend==="supa"){ for(const id of ex) await remove("pis",id); } else { try{ await patchDoc("board","roster",{pis:Object.fromEntries(ex.map(id=>[id,DEL]))}); }catch(e){ writeError(e); } } }
      }
      toast("Example data removed"); render(true); break; }
    case "id-pick": {
      const v2=document.getElementById("id-pick")?.value; if(!v2){ toast("Choose your name."); break; }
      if(await write("pis", v2, {owner: S.uid||null, updated:nowIso()}, true)){ setMe(v2); ui.tab="hours"; render(true); }
      break; }
    case "setup-done": {
      const n=document.getElementById("su-name")?.value.trim(), l=document.querySelector('input[name="su-lvl"]:checked')?.value;
      ui.setup={name:n||"", level:l||""};
      if(!n){ toast("Enter your name."); break; }
      if(!l){ toast("Choose Full or Provisional."); break; }
      const fb=S.backend==="supa", id = fb ? "pi-"+newId() : S.me;
      const doc={name:n.slice(0,60), level:l, blocks: S.mode==="demo" ? structuredClone(DEMO_YOU_BLOCKS) : [], willing: S.mode==="demo" ? structuredClone(DEMO_YOU_WILLING) : [], updated:nowIso()};
      if(fb) doc.owner=S.uid||null;
      if(await write("pis", id, doc)){ if(fb) setMe(id); if(S.mode==="demo" && isJCO()) ui.admin=true; ui.tab="hours"; ui.setup=null; toast("Now mark the hours you work each week."); render(true); }
      break; }
    case "save-name": {
      const n=document.getElementById("pf-name")?.value.trim(), uid=ui.editing||S.me;
      if(!n){ toast("Enter a name."); break; }
      if(await write("pis", uid, {name:n.slice(0,60), updated:nowIso()}, true)){ if(S.mode==="demo" && isJCO()) ui.admin=true; toast("Name saved"); render(true); }
      break; }
    case "add-admin": {
      const n=document.getElementById("na-name")?.value.trim(), em=document.getElementById("na-email")?.value.trim(), pw=document.getElementById("na-pw")?.value||"";
      if(!n || !em){ toast("Enter their name and email."); break; }
      if(S.backend!=="supa"){ S.admins={...S.admins, ["a-"+newId()]:{name:n,email:em}}; toast(`${n} is now an admin (example only)`); render(true); break; }
      if(pw.length<8){ toast("Use a temporary password of at least 8 characters."); break; }
      try{
        // a second, throwaway connection creates their account without signing you out
        S.sb2 ||= supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:"shift-board-secondary"}});
        const { data, error } = await S.sb2.auth.signUp({email:em, password:pw});
        if(error) throw error;
        const uid=data.user?.id;
        if(!uid || (Array.isArray(data.user.identities) && data.user.identities.length===0)){ toast("That email already has an account. Add them from Supabase instead (see the setup notes).", 7000); break; }
        const r = await S.sb.from("admins").insert({uid, name:n.slice(0,60), email:em});
        if(r.error) throw r.error;
        toast(`${n} is now an admin`); await loadAdmins();
      }catch(err){
        toast(/invalid/i.test(err?.message||"") ? "That email doesn't look right." : /password/i.test(err?.message||"") ? (err.message) : "Couldn't add that admin. Check the email and try again.", 6000);
      }
      break; }
    case "rm-admin":
      if(ui.confirm!=="ad"+v){ ui.confirm="ad"+v; render(true); break; }
      ui.confirm=null;
      if(S.backend==="supa"){ if(await remove("admins", v)){ toast("Admin removed"); await loadAdmins(); } }
      else { const a={...S.admins}; delete a[v]; S.admins=a; render(true); }
      break;
    case "switch-user": setMe(null); break;
  }
});
function setMe(id){
  S.me=id; try{ id?localStorage.setItem("st-me",id):localStorage.removeItem("st-me"); }catch(e){}
  try{ S.mine = JSON.parse(localStorage.getItem("st-seen-"+id)||"null") || {seen:{}}; }catch(e){ S.mine={seen:{}}; }
  render(true);
}
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && ui.modal){ ui.modal=null; renderModal(); }
  if(e.target.dataset?.tc && e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); document.querySelector(`[data-act="tsend"][data-v="${e.target.dataset.tc}"]`)?.click(); }
});
document.addEventListener("change", async e=>{
  const el=e.target;
  if(el.dataset.actChange==="layer"){ ui.layer=el.value; ui.confirm=null; render(true); return; }
  if(el.dataset.actChange==="level"){
    const uid=ui.editing||S.me, cur=S.pis[uid]||{blocks:[]};
    await write("pis", uid, {...cur, level:el.value, blocks: ui.dirty?slotsToBlocks(ui.slots):(cur.blocks||[]), willing: ui.dirty?slotsToBlocks(ui.wslots||new Set()):(cur.willing||[]), updated:nowIso()});
    toast(`Set to ${lvlName(el.value)} PI`); render(true);
  }
  if(el.dataset.pilvl){ await write("pis", el.dataset.pilvl, {level:el.value, updated:nowIso()}, true); toast(`Set to ${lvlName(el.value)}`); }
  if(el.dataset.draft){ const d=ui.draft[el.dataset.draft] ||= {kind:"cover",swap:"",note:""}; d[el.dataset.k]=el.value; if(el.dataset.k==="kind") render(true); }
  if(el.dataset.adm){ admInput(el); render(true); }
});
function admInput(el){
  const d=ui.adminDraft; if(!d) return; const k=el.dataset.adm;
  if(k==="day") d.days[+el.dataset.i]=el.checked;
  else if(k==="fullTakesProv") d.fullTakesProv=el.checked;
  else if(k==="open"||k==="close") d[k]=+el.value;
  else if(k==="urgentHours"||k==="lookahead"){ const n=Math.round(+el.value); if(n>0) d[k]=n; }
  else if(k==="announcement") d.announcement=el.value.slice(0,300);
}
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.dataset.draft){ const d=ui.draft[el.dataset.draft] ||= {kind:"cover",swap:"",note:""}; d[el.dataset.k]=el.value; }
  if(el.dataset.tc){ ui.tdraft[el.dataset.tc]=el.value; el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,160)+"px"; }
  if(el.dataset.adm==="announcement") admInput(el);
});

/* grid painting: mouse/pen drag paints, touch and keyboard toggle via click */
let painting=null, lastPtr="mouse";
document.addEventListener("pointerdown", e=>{
  lastPtr=e.pointerType;
  const c=e.target.closest("#hgrid .cell"); if(!c || c.disabled || e.pointerType==="touch") return;
  e.preventDefault(); painting=!curSet().has(c.dataset.slot); paintCell(c,painting);
});
document.addEventListener("pointermove", e=>{
  if(painting===null) return;
  const c=document.elementFromPoint(e.clientX,e.clientY)?.closest?.("#hgrid .cell");
  if(c && !c.disabled && curSet().has(c.dataset.slot)!==painting) paintCell(c,painting);
});
const endPaint=()=>{ if(painting!==null){ painting=null; scheduleSave(); render(true);} };
document.addEventListener("pointerup", endPaint); document.addEventListener("pointercancel", endPaint);
document.addEventListener("click", e=>{
  const c=e.target.closest("#hgrid .cell"); if(!c || c.disabled) return;
  if(e.detail>0 && lastPtr!=="touch") return;
  paintCell(c, !curSet().has(c.dataset.slot)); scheduleSave(); render(true);
});

function subscribe(db){
  const lost = err=>{ if(err?.code!=="revoked") toast("Lost connection to the board. Reload to reconnect.",6000); };
  db.doc("board/roster").onSnapshot(snap=>{
    const all=(snap.exists && snap.data()?.pis) || {}, o={};
    for(const [k,v] of Object.entries(all)) if(v) o[k]=v;
    S.pis=o; S.rosterExists=snap.exists; S.loaded.pis=true; render();
  }, lost);
  db.collection("trades").onSnapshot(snap=>{
    const t={}, of={}, ms={};
    snap.docs.forEach(d=>{
      const {offers, msgs, ...rest} = d.data()||{};
      t[d.id]=rest;
      for(const [k,v] of Object.entries(offers||{})) if(v) of[k]={...v, trade:d.id};
      for(const [k,v] of Object.entries(msgs||{})) if(v) ms[k]={...v, trade:d.id, ch:"t:"+d.id};
    });
    S.trades=t; S.offers=of; S.msgs=ms; S.loaded.trades=S.loaded.offers=S.loaded.msgs=true;
    purgePast(); render();
  }, lost);
  db.doc("config/studio").onSnapshot(snap=>{ S.config = snap.exists ? snap.data() : null; render(); }, ()=>{});
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function supaLoadAll(){
  const tables=["pis","trades","offers","msgs","config"];
  const res = await Promise.all(tables.map(t=>S.sb.from(t).select("*").limit(5000)));
  const bad = res.find(r=>r.error); if(bad) throw bad.error;
  const [p,t,o,m,c] = res.map(r=>r.data||[]);
  S.pis    = Object.fromEntries(p.map(r=>[r.id, r.data]));
  S.trades = Object.fromEntries(t.map(r=>[r.id, r.data]));
  S.offers = Object.fromEntries(o.map(r=>[r.id, {...r.data, trade:r.trade}]));
  S.msgs   = Object.fromEntries(m.map(r=>[r.id, {...r.data, trade:r.trade, ch:"t:"+r.trade}]));
  S.config = c.find(r=>r.id==="studio")?.data || null;
  S.loaded.pis=S.loaded.trades=S.loaded.offers=S.loaded.msgs=true;
  purgePast(); render();
}
function supaChange(tb,p){
  if(tb==="admins"){ if(ui.admin) loadAdmins(); return; }
  if(p.eventType==="DELETE"){ if(p.old?.id) localRemove(tb, p.old.id); }
  else if(p.new?.id) localApply(tb, p.new.id, p.new.data||{}, p.new.trade);
  if(tb==="trades") purgePast();
  render();
}
function supaSubscribe(){
  const ch=S.sb.channel("shift-board");
  for(const tb of ["pis","trades","offers","msgs","config","admins"]) ch.on("postgres_changes", {event:"*", schema:"public", table:tb}, p=>supaChange(tb,p));
  ch.subscribe(status=>{
    if(status==="SUBSCRIBED"){ if(S.rtDropped){ S.rtDropped=false; supaLoadAll().catch(()=>{}); } }
    else if(status==="CHANNEL_ERROR" || status==="TIMED_OUT" || status==="CLOSED") S.rtDropped=true;
  });
  // catch up after the tab has been in the background for a while
  let hiddenAt=0;
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="hidden") hiddenAt=Date.now();
    else if(hiddenAt && Date.now()-hiddenAt>120000) supaLoadAll().catch(()=>{});
  });
}
async function startSupabase(){
  try{
    await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js");
    S.sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"shift-board-auth"}});
    let { data:{ session } } = await S.sb.auth.getSession();
    if(!session){
      const r = await S.sb.auth.signInAnonymously();
      if(r.error) throw r.error;
    }
    S.backend="supa"; S.mode="live"; S.canWrite=true;
    S.sb.auth.onAuthStateChange((_e, sess)=>{ S.uid = sess?.user?.id || null; });
    await checkAdmin();
    let me=null; try{ me=localStorage.getItem("st-me"); }catch(e){}
    S.me=me; try{ S.mine = JSON.parse(localStorage.getItem("st-seen-"+me)||"null") || {seen:{}}; }catch(e){}
    await supaLoadAll();
    supaSubscribe();
    render(true);
  }catch(e){
    console.error(e);
    startDemo(/anonymous/i.test(e?.message||"") ? "Couldn't sign in to Supabase. Turn on anonymous sign-ins (see the setup notes)."
      : /relation|does not exist|schema cache/i.test(e?.message||"") ? "Supabase is connected, but its tables aren't set up yet. Run supabase-setup.sql."
      : "Couldn't connect to Supabase. Check the URL and key at the top of the file.");
  }
}
async function boot(){
  if(location.hash==="#admin") ui.tab="admin";
  render(true);
  if(window.claude?.use){
    const [db,user]=await Promise.all([claude.use("db"), claude.use("user")]);
    if(db){
      S.db=db; S.user=user; S.backend="claude"; S.me = user ? await user.id() : null; try{ S.profileName = user ? await user.name() : ""; }catch(e){}
      const cw = user ? await user.can("data.write") : null;
      if(cw===false || !S.me) S.canWrite=false;
      ui.admin = user ? await user.isOwner() : false;
      S.admins = {owner:{name:"John Overend", email:"Board owner"}};
      if(!S.me) S.me="__nobody__";
      else { try{ const st=await db.doc(`data/users/${S.me}/state`).get(); if(st.exists) S.mine={seen:{}, ...st.data()}; }catch(e){} }
      S.mode="live"; subscribe(db); return;
    }
  }
  if(SUPABASE_URL && SUPABASE_KEY){ await startSupabase(); return; }
  startDemo("This copy isn't connected to shared storage yet. Add your Supabase URL and key at the top of the file.");
}
window.addEventListener("hashchange", ()=>{ if(location.hash==="#admin"){ ui.tab="admin"; render(true); } });
boot();
